  <g transform="translate(40, 305)">
    <text x="0" y="0" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8">Java System Status: <tspan fill="#34d399">In-Memory Catalog Active</tspan> | Total Records: <tspan fill="#38bdf8">148 Books</tspan></text>
