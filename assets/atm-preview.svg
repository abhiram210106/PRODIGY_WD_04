<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="atmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091422" />
      <stop offset="100%" stop-color="#14283c" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#051728" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#atmBg)" />

  <!-- Top bar -->
  <rect width="600" height="36" rx="16" fill="#1b2a3f" />
  <rect y="26" width="600" height="10" fill="#1b2a3f" />
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <text x="300" y="22" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">ATM Web Interface • HTML / CSS / JavaScript</text>

  <!-- Left Side: ATM Screen Simulation -->
  <rect x="30" y="55" width="340" height="280" rx="10" fill="url(#screenGrad)" stroke="#0ea5e9" stroke-width="2" />
  
  <!-- ATM Header inside screen -->
  <rect x="30" y="55" width="340" height="36" rx="10" fill="#0c3256" />
  <rect x="30" y="81" width="340" height="10" fill="#0c3256" />
  <text x="50" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">GLOBAL DIGITAL BANK ATM</text>
  <text x="350" y="78" font-family="'Fira Code', monospace" font-size="10" fill="#7dd3fc" text-anchor="end">ACTIVE SECURE</text>

  <text x="200" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Select Transaction</text>

  <!-- ATM Option Buttons on Screen -->
  <!-- Left Column -->
  <rect x="45" y="145" width="135" height="34" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1" />
  <text x="55" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#ffffff">‹ Fast Cash</text>

  <rect x="45" y="190" width="135" height="34" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1" />
  <text x="55" y="211" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#ffffff">‹ Withdrawal</text>

  <rect x="45" y="235" width="135" height="34" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1" />
  <text x="55" y="256" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#ffffff">‹ Balance Inquiry</text>

  <!-- Right Column -->
  <rect x="220" y="145" width="135" height="34" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1" />
  <text x="345" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="end">Deposit Funds ›</text>

  <rect x="220" y="190" width="135" height="34" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1" />
  <text x="345" y="211" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="end">Mini Statement ›</text>

  <rect x="220" y="235" width="135" height="34" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1" />
  <text x="345" y="256" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="end">PIN Change ›</text>

  <!-- Screen Footer Status -->
  <rect x="45" y="285" width="310" height="32" rx="4" fill="#061c33" />
  <text x="200" y="305" font-family="'Fira Code', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Interactive JavaScript Simulator</text>

  <!-- Right Side: Keypad & Card Slot -->
  <rect x="390" y="55" width="180" height="280" rx="10" fill="#162030" stroke="rgba(255,255,255,0.06)" />
  
  <!-- Card Slot -->
  <rect x="410" y="70" width="140" height="12" rx="3" fill="#090e17" stroke="#38bdf8" stroke-width="1" />
  <text x="480" y="94" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">INSERT CARD</text>

  <!-- Numeric Pin Keypad -->
  <g transform="translate(415, 115)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="36" height="32" rx="4" fill="#202e42" />
    <text x="18" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">1</text>
    <rect x="46" y="0" width="36" height="32" rx="4" fill="#202e42" />
    <text x="64" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">2</text>
    <rect x="92" y="0" width="36" height="32" rx="4" fill="#202e42" />
    <text x="110" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">3</text>

    <!-- Row 2 -->
    <rect x="0" y="40" width="36" height="32" rx="4" fill="#202e42" />
    <text x="18" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">4</text>
    <rect x="46" y="40" width="36" height="32" rx="4" fill="#202e42" />
    <text x="64" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">5</text>
    <rect x="92" y="40" width="36" height="32" rx="4" fill="#202e42" />
    <text x="110" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">6</text>

    <!-- Row 3 -->
    <rect x="0" y="80" width="36" height="32" rx="4" fill="#202e42" />
    <text x="18" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">7</text>
    <rect x="46" y="80" width="36" height="32" rx="4" fill="#202e42" />
    <text x="64" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">8</text>
    <rect x="92" y="80" width="36" height="32" rx="4" fill="#202e42" />
    <text x="110" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">9</text>

    <!-- Row 4 (Actions) -->
    <rect x="0" y="120" width="36" height="32" rx="4" fill="#ef4444" />
    <text x="18" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">CAN</text>
    <rect x="46" y="120" width="36" height="32" rx="4" fill="#202e42" />
    <text x="64" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">0</text>
    <rect x="92" y="120" width="36" height="32" rx="4" fill="#10b981" />
    <text x="110" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">ENT</text>
  </g>

  <!-- Cash Dispenser Slot -->
  <rect x="410" y="290" width="140" height="20" rx="4" fill="#090e17" stroke="rgba(255,255,255,0.1)" />
  <text x="480" y="304" font-family="'Inter', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">CASH DISPENSER</text>
</svg>
