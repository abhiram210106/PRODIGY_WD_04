<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="examBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#examBg)" />

  <!-- Window Header -->
  <rect width="600" height="36" rx="16" fill="#1f2937" />
  <rect y="26" width="600" height="10" fill="#1f2937" />
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <text x="300" y="22" font-family="'Fira Code', monospace" font-size="11" fill="#9ca3af" text-anchor="middle">Online Examination System • Java &amp; Web Technologies</text>

  <!-- Top bar inside exam -->
  <rect x="25" y="55" width="550" height="46" rx="8" fill="#1f293d" stroke="rgba(255,255,255,0.08)" />
  <text x="45" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f3f4f6">Computer Science Midterm Assessment</text>
  
  <!-- Timer widget -->
  <g transform="translate(425, 65)">
    <rect width="135" height="26" rx="13" fill="#111827" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="16" cy="13" r="4" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" />
    </circle>
    <text x="75" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">45:20 REMAINING</text>
  </g>

  <!-- Left Main Area: Question and Options -->
  <rect x="25" y="115" width="375" height="220" rx="10" fill="#131d2e" stroke="rgba(255,255,255,0.06)" />
  
  <text x="45" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#60a5fa">Question 04 of 25</text>
  <text x="45" y="165" font-family="'Inter', sans-serif" font-size="11" fill="#e2e8f0">Which Java collection interface ensures unique elements and maintains</text>
  <text x="45" y="180" font-family="'Inter', sans-serif" font-size="11" fill="#e2e8f0">an ascending natural order of keys?</text>

  <!-- Options -->
  <g transform="translate(45, 195)">
    <!-- Option A -->
    <rect width="335" height="26" rx="4" fill="#1e293b" />
    <circle cx="14" cy="13" r="5" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="30" y="17" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">A. HashSet&lt;T&gt;</text>

    <!-- Option B (Selected) -->
    <rect y="32" width="335" height="26" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="14" cy="45" r="5" fill="#3b82f6" />
    <circle cx="14" cy="45" r="2.5" fill="#ffffff" />
    <text x="30" y="49" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#93c5fd">B. TreeSet&lt;T&gt; (Selected Answer)</text>

    <!-- Option C -->
    <rect y="64" width="335" height="26" rx="4" fill="#1e293b" />
    <circle cx="14" cy="77" r="5" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="30" y="81" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">C. LinkedList&lt;T&gt;</text>
  </g>

  <g transform="translate(45, 298)">
    <rect width="90" height="26" rx="4" fill="#334155" />
    <text x="45" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#f1f5f9" text-anchor="middle">‹ Previous</text>

    <rect x="100" y="0" width="100" height="26" rx="4" fill="#2563eb" />
    <text x="150" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Save &amp; Next ›</text>
  </g>

  <!-- Right Palette: Question Navigator -->
  <rect x="415" y="115" width="160" height="220" rx="10" fill="#152033" stroke="rgba(255,255,255,0.06)" />
  <text x="430" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Question Palette</text>

  <!-- Matrix of questions -->
  <g transform="translate(430, 155)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="24" height="24" rx="4" fill="#10b981" />
    <text x="12" y="16" font-family="'Fira Code', monospace" font-size="9" fill="#fff" text-anchor="middle">1</text>
    <rect x="30" y="0" width="24" height="24" rx="4" fill="#10b981" />
    <text x="42" y="16" font-family="'Fira Code', monospace" font-size="9" fill="#fff" text-anchor="middle">2</text>
    <rect x="60" y="0" width="24" height="24" rx="4" fill="#10b981" />
    <text x="72" y="16" font-family="'Fira Code', monospace" font-size="9" fill="#fff" text-anchor="middle">3</text>
    <rect x="90" y="0" width="24" height="24" rx="4" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5" />
    <text x="102" y="16" font-family="'Fira Code', monospace" font-size="9" fill="#fff" text-anchor="middle">4</text>

    <!-- Row 2 -->
    <rect x="0" y="32" width="24" height="24" rx="4" fill="#475569" />
    <text x="12" y="48" font-family="'Fira Code', monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">5</text>
    <rect x="30" y="32" width="24" height="24" rx="4" fill="#475569" />
    <text x="42" y="48" font-family="'Fira Code', monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">6</text>
    <rect x="60" y="32" width="24" height="24" rx="4" fill="#f59e0b" />
    <text x="72" y="48" font-family="'Fira Code', monospace" font-size="9" fill="#fff" text-anchor="middle">7</text>
    <rect x="90" y="32" width="24" height="24" rx="4" fill="#475569" />
    <text x="102" y="48" font-family="'Fira Code', monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">8</text>
  </g>

  <!-- Legend -->
  <g transform="translate(430, 245)">
    <circle cx="6" cy="6" r="4" fill="#10b981" />
    <text x="16" y="9" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">Answered</text>
    <circle cx="70" cy="6" r="4" fill="#f59e0b" />
    <text x="80" y="9" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">Review</text>
    <circle cx="6" cy="22" r="4" fill="#475569" />
    <text x="16" y="25" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">Not Visited</text>
  </g>

  <rect x="430" y="295" width="130" height="28" rx="4" fill="#ef4444" />
  <text x="495" y="313" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Submit Exam</text>
</svg>
