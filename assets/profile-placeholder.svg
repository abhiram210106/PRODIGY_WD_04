<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" />

  <!-- Subtle Grid lines -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  </pattern>
  <rect width="500" height="500" rx="36" fill="url(#grid)" />

  <!-- Outer Glowing Rings -->
  <circle cx="250" cy="220" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="250" cy="220" r="145" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1" />
  
  <!-- Outer Glow Aura -->
  <circle cx="250" cy="220" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Inner Avatar Shield -->
  <circle cx="250" cy="220" r="115" fill="#13192b" stroke="url(#ringGrad)" stroke-width="3.5" />

  <!-- Monogram Initials "VA" -->
  <text x="250" y="248" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="82" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">VA</text>

  <!-- Status / Software Badge at bottom of circle -->
  <g transform="translate(160, 315)">
    <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">VAKA ABHIRAM</text>
  </g>

  <!-- Upload Guide Prompt at bottom -->
  <g transform="translate(75, 385)">
    <rect width="350" height="70" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <!-- Camera Icon -->
    <path d="M 40 40 L 46 32 L 58 32 L 64 40 L 74 40 A 4 4 0 0 1 78 44 L 78 60 A 4 4 0 0 1 74 64 L 30 64 A 4 4 0 0 1 26 60 L 26 44 A 4 4 0 0 1 30 40 Z" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="52" cy="51" r="7" fill="none" stroke="#818cf8" stroke-width="2" />
    
    <text x="92" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Profile Photo Placeholder</text>
    <text x="92" y="56" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Click "Upload Photo" or save your image to assets/profile.jpg</text>
  </g>

  <!-- Decorative Corner Tech Accents -->
  <path d="M 25 50 L 25 25 L 50 25" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
  <path d="M 475 50 L 475 25 L 450 25" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
  <path d="M 25 450 L 25 475 L 50 475" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
  <path d="M 475 450 L 475 475 L 450 475" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
</svg>
